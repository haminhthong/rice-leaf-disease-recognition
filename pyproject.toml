[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rice-leaf-disease-detection"
version = "1.0.0"
description = "YOLOv8 object detection pipeline for bacterial leaf blight and brown spot"
requires-python = ">=3.10"
dependencies = [
  "ultralytics==8.3.220",
  "numpy>=1.24,<3",
  "opencv-python>=4.8",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.scripts]
rice-prepare = "rice_leaf_detection.prepare:main"
rice-train = "rice_leaf_detection.train:main"
rice-evaluate = "rice_leaf_detection.evaluate:main"
rice-predict = "rice_leaf_detection.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
